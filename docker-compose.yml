services:
  backend:
    build: ./backend
    container_name: lyftr-backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/app.db
      LITELLM_CACHE_DIR: /data/litellm_cache
    ports:
      - "8000:8000"
    volumes:
      - lyftr_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: lyftr-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  lyftr_data:
